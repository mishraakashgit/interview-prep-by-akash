version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci --cache .npm --prefer-offline
        # Deploys Cognito auth + the data API for this branch and writes amplify_outputs.json
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
